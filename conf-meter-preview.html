<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview confidence meter</title>
    <style>
      :root {
        color-scheme: dark;
        --color-border: rgba(84, 84, 84, 0.18);
        --color-border-hover: rgba(84, 84, 84, 0.55);
        --color-background: #1e1e1e;
        --color-text: #eee;
      }
      body {
        margin: 2rem;
        font: 14px/1.4 system-ui, sans-serif;
        background: #121212;
        color: var(--color-text);
      }
      .row {
        display: grid;
        grid-template-columns: 4rem 5.5rem 5.5rem;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .field {
        width: 100%;
        box-sizing: border-box;
        padding: 0.3rem 0.4rem;
        font-size: 0.85rem;
        text-align: right;
        border: 1px solid var(--color-border);
        border-radius: 6px;
        background-color: var(--color-background);
        color: var(--color-text);
      }
      .field.metered {
        --conf-stroke: rgba(255, 255, 255, 0.2);
        background-image:
          linear-gradient(var(--conf-stroke), var(--conf-stroke)),
          linear-gradient(var(--conf-stroke), var(--conf-stroke));
        background-size: var(--conf, 0%) 1px, var(--conf, 0%) 1px;
        background-position: left top, left bottom;
        background-repeat: no-repeat;
      }
      label {
        display: block;
        margin-top: 0.35rem;
        font-size: 0.75rem;
        color: #999;
      }
    </style>
  </head>
  <body>
    <h1>Confidence meter (20 / 100 / 50)</h1>
    <p>Cadre complet + traits haut/bas (confidence).</p>
    <div class="row" id="row"></div>
    <script>
      const cases = [
        { value: '2', pct: 20 },
        { value: '1.29', pct: 100 },
        { value: '2.58', pct: 50 },
      ]
      const row = document.getElementById('row')
      for (const c of cases) {
        const wrap = document.createElement('div')
        wrap.innerHTML = `
          <input class="field metered" style="--conf:${c.pct}%" value="${c.value}" readonly />
          <label>${c.pct}%</label>
        `
        row.appendChild(wrap)
      }
    </script>
  </body>
</html>
